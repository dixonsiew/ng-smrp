<section class="content-header">
  <div class="container-fluid">
    <div class="row mb-2">
      <div class="col-12">
        <h1 class="m-0 text-dark">Edit {{ title }}</h1>
      </div>
    </div>
  </div>
</section>
<section class="content">

                  <input type="text" class="form-control" placeholder="ACCOUNT NO" name="ACCOUNT_NO" formControlName="ACCOUNT_NO" readonly
                    [ngClass]="{'is-invalid': invalid('ACCOUNT_NO')}">
                  @if (invalid('ACCOUNT_NO') && f['ACCOUNT_NO'].hasError('required')) {
                  <small class="badge badge-danger">
                    ACCOUNT NO is required
                  </small>
                  }

              </div>

                    <div class="input-group-btn">

                        <i class="fa fa-calendar-alt"></i>
                      </button>
                    </div> -->

                  <input type="text" class="form-control" placeholder="REFANTENATALCARECODE" name="REFANTENATALCARECODE" formControlName="REFANTENATALCARECODE"
                    [ngClass]="{'is-invalid': invalid('REFANTENATALCARECODE')}">
                </div>
              </div>
              <div class="form-group row">
                <label class="col-sm-2 col-form-label">LABOUR METHOD</label>
                <div class="col-sm-10">
                  <input type="text" class="form-control" placeholder="LABOUR METHOD" name="LABOUR_METHOD" formControlName="LABOUR_METHOD"
                    [ngClass]="{'is-invalid': invalid('LABOUR_METHOD')}">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <div class="card card-row card-primary">
            <div class="card-header">
              <h5 class="card-title m-0">Labour</h5>
            </div>
            <div class="card-body">
              <div class="form-group row">
                <label class="col-sm-2 col-form-label">DELIVERY DATE</label>
                <div class="col-sm-4">
                  <div class="input-group">
                    <input type="text" class="form-control" formControlName="DELIVERY_DATE" name="DELIVERY_DATE" bsDatepicker #DELIVERY_DATE="bsDatepicker"
                      [bsConfig]="{ containerClass: 'theme-blue', dateInputFormat: 'YYYY-MM-DD' }">
                    <div class="input-group-btn">
                      <button type="button" class="btn btn-default" (click)="DELIVERY_DATE.show()" [attr.aria-expanded]="DELIVERY_DATE.isOpen">
                        <i class="fa fa-calendar-alt"></i>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-sm-2 col-form-label">RESULT OF BIRTH</label>
                <div class="col-sm-10">
                  <input type="text" class="form-control" placeholder="RESULT_OF_BIRTH" name="RESULT_OF_BIRTH" formControlName="RESULT_OF_BIRTH"
                    [ngClass]="{'is-invalid': invalid('RESULT_OF_BIRTH')}">
                </div>
              </div>
              <div class="form-group row">
                <label class="col-sm-2 col-form-label">DELIVERY TYPE</label>
                <div class="col-sm-10">
                  <ng-select 
                    [items]="deliverytypeList" 
                    bindLabel="desc" 
                    bindValue="desc" 
                    placeholder="Please select"
                    formControlName="DELIVERY_TYPE" 
                    name="DELIVERY_TYPE"></ng-select>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-sm-2 col-form-label">CHILD SEX</label>
                <div class="col-sm-10">
                  <ng-select 
                    [items]="genderList" 
                    bindLabel="desc" 
                    bindValue="desc" 
                    placeholder="Please select"
                    formControlName="CHILD_SEX" 
                    name="CHILD_SEX"></ng-select>
                </div>
              </div>
              <div class="form-group row">
                <label class="col-sm-2 col-form-label">WEIGHT</label>
                <div class="col-sm-10">
                  <input type="text" class="form-control" placeholder="WEIGHT" name="WEIGHT" formControlName="WEIGHT"
                    [ngClass]="{'is-invalid': invalid('WEIGHT')}">
                </div>
              </div>
              <div class="form-group row">
                <label class="col-sm-2 col-form-label">LENGTH</label>
                <div class="col-sm-10">
                  <input type="text" class="form-control" placeholder="LENGTH" name="LENGTH" formControlName="LENGTH"
                    [ngClass]="{'is-invalid': invalid('LENGTH')}">
                </div>
              </div>
            </div>
            <div class="card-footer">
              <button type="button" class="btn btn-outline-dark mr-2" (click)="onBack()"><i class="fas fa-chevron-circle-left"></i> Back</button>
              <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
            </div>
          </div>
        </div>
      </div>
