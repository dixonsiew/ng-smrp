pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # If Ingress forwards /my-app/... to this pod:
        location /smrp/ {
            try_files $uri $uri/ /smrp/index.html;
        }
        
        # Optional: Redirect root to the sub-path if accessed directly
        location = / {
            return 301 /smrp/;
        }
    }
}