apiVersion: apps/v1
kind: Deployment
metadata:
  name: ng-smrp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ng-smrp
  template:
    metadata:
      labels:
        app: ng-smrp
    spec:
      containers:
      - name: ng-container
        image: wfsiew888/ng-smrp:1.11
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ng-smrp-service
spec:
  type: NodePort
  selector:
    app: ng-smrp
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30002
